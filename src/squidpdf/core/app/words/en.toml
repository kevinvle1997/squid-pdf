# Every sentence the app says, in English, under the key a Message names it by.
#
# Another language is another file like this one, named by its tag (fr.toml,
# pt-br.toml), with the same keys and the same {placeholders}. A key it leaves
# out is said in English. A key is renamed only with the browser, in the same change:
# the browser branches on it.

# What's wrong with a replacement.
# `{font}` is the face that draws the line instead.
missing = "no {chars} in this font, so the line is drawn in {font}"
will_leave_out = "{letters} will be left out: no font we have can draw them"
chosen_unavailable = "{chosen} can't be used here, so this is drawn in {font}"
not_offered = "too far to fit without looking different, so it's left long"
too_long = "{delta_pt} pt too long"
# A font the file doesn't let us use. `{font}` is the face that draws instead.
substitute = "Edits here use {font}, which may be a different width from the original."
# The same, when that face's letters are exactly as wide as the original's.
substitute_same_widths = "Edits here use {font}, whose letters are the same width as the original's."

# Why an edit was left out.
no_span = "This edit points at text that isn't in this document."
no_page = "This edit points at a page that isn't in this document."

# Why a font's own copy can't be used, so a similar font stands in. One per font.
font_not_in_file = "This font isn't stored in the file, so a similar font stands in for it."
font_unreadable = "This font is stored in the file but can't be read, so a similar font stands in for it."
font_no_letter_list = "This font is stored in the file without saying which shape is which letter, so a similar font stands in for it."
font_lacks_letters = "The file's copy of this font can't draw every letter here, so a similar font stands in for it."
font_cant_write = "This font is stored in the file in a way we can't write new text with yet, so a similar font stands in for it."
# Why another copy by the font's name, in the file or Google's, lends it no letter.
copy_stored_apart = "Another copy of this font has the letters needed here, but it's stored in a way that can't be mixed with this one, so a similar font stands in for it."
copy_too_few_shared = "Another copy of this font has the letters needed here, but too few letters in common with this one to be sure it's the same font, so a similar font stands in for it."
copy_other_widths = "Another font by this name has the letters needed here, but its letters are a different width, so a similar font stands in for it."
# Why Google Fonts can't lend a font the letters its copy in the file lacks. Not said yet.
google_not_listed = "Google Fonts has no font by this name, so it can't lend the letters missing here."
google_no_cut = "Google Fonts has this font, but not in this weight and style, so it can't lend the letters missing here."
google_name_reserved = "Google Fonts has this font only in a form we'd have to change, and its licence keeps its name for the original, so it can't lend the letters missing here."
google_not_fetched = "Google's copy of this font couldn't be fetched, so it can't lend the letters missing here."

# Why text in its own font still won't come back as it looks now. One per span.
turned_text = "This text is turned on the page, and edits are drawn level, so an edit here will look different."
spaced_text = "This text is spaced out or stretched in a way edits don't copy yet, so an edit here will look different."
undrawable_letters = "No font we have can draw {letters} here, so an edit here leaves them out."

# An edit that went in, but not quite as asked. `{letters}` is space-separated.
font_not_added = "The file's own font couldn't be used for this edit, so a similar font drew it."
left_out = "Left out {letters}: no font we have can draw them."
# Text a form field shows is drawn by the field, not the page, so it can't be changed yet.
form_field_not_edited = "This text is a form field, which can't be edited yet, so it's left as it was."
form_field_not_redacted = "This text is a form field, which can't be redacted yet, so the file can't be downloaded with this redaction."
# `{font}` is a face we ship.
face_not_trimmed = "{font} went into the file whole, not only the letters used, so the file is larger than it needs to be."
# Exporting some pages of a tagged file drops its tags.
tags_dropped = "The tags that tell screen readers how to read this file went with the pages left out, so this file has none."

# Said by the browser after its own steps, not the server's.
# The document's hour ran out mid-edit, and the browser uploaded its copy again.
reopened = "This document's hour ran out, so it was opened again from this browser."
# An export that left some edits out, because they point at nothing in the document.
export_left_out = "Downloaded, but some changes were left out: they point at text that isn't in this document."

# Asked before the user edits text they redacted: yes goes ahead, no keeps the redaction.
undo_redaction = "This text is redacted. Editing it undoes the redaction. Edit it anyway?"

# The ways out of an overflow: what each is called, and what it does.
shrink_label = "Make it slightly smaller"
shrink_detail = "Reduces the type size just enough to fit."
condense_label = "Tighten the letters"
condense_detail = "Squeezes the spacing by a few percent, which isn't noticeable at this size."
as_is_label = "Leave it long"
as_is_detail = "Runs {delta_pt} pt past where the original ended."

# A Problem's `detail`, shown to the user verbatim. Limits are placeholders so
# the sentence can't drift from the number the server enforces.
not_a_pdf = "This isn't a PDF."
too_large = "This file is over {mb} MB."
too_many_pages = "This PDF has more than {pages} pages."
encrypted = "This PDF is password-protected. Open it with the password and save a copy first."
damaged = "This PDF is damaged and can't be opened."
not_found = "Nothing here. It may have expired."  # never shown: the browser re-uploads
no_such_page = "This document doesn't have that page."
redaction_conflict = "This text has a redaction. Undo it to edit."
bad_reference = "A redaction points at text that isn't in this document: {span_id}."
redaction_failed = "Couldn't remove “{text}” on page {page}, so nothing was downloaded."
font_mismatch = "This isn't the font the document uses. Its letters are a different width."
invalid_request = "Something went wrong sending this to us. Reload the page and try again."
method_not_allowed = "Something went wrong sending this to us. Reload the page and try again."
rate_limited = "Too many files at once. Try again in a minute."
# support@example.com is a placeholder until there's a real inbox: the same in every language.
too_slow = "This took too long, so we stopped. Try again, and if it keeps happening, email support@example.com."
too_heavy = "This PDF needs more memory than we can give it. If it keeps happening, email support@example.com."
too_many_edits = "That's more than {edits} changes at once. Download what you have and go on from there."
text_too_long = "New text can be up to {chars} characters."
request_too_large = "That's too much to send at once. Download what you have and go on from there."
server_error = "Something went wrong on our side. Try again."
server_full = "We can't take new files right now. Try again in a few minutes."
no_workers = "We can't work on files right now. Try again in a few minutes."

# A notice on an upload that worked, but may not be what the user expected.
no_text = "This PDF has no text we can edit. It may be a scan or a photo of the page."

# Not sentences: what joins a list's items, and what joins several messages in one line.
# A list whose placeholder has no join_<its name> here is joined as items.
join_chars = " or "
join_letters = " "
join_items = ", "
join_parts = "; "

# What sets a number's fraction apart: "3.1" in English, "3,1" in French.
decimal_separator = "."

# A character that draws nothing on its own, named so a person can tell which it is:
# a space, an invisible mark, or an accent typed alone. The key is its code point,
# char_u202f for U+202F. One not here is said by Unicode's name, lower case.
char_u0009 = "tab"
char_u0020 = "space"
char_u00a0 = "no-break space"
char_u00ad = "optional hyphen"
char_u2002 = "en space"
char_u2003 = "em space"
char_u2007 = "figure space"
char_u2009 = "thin space"
char_u200a = "hair space"
char_u200b = "zero-width space"
char_u200c = "zero-width non-joiner"
char_u200d = "zero-width joiner"
char_u200e = "left-to-right mark"
char_u200f = "right-to-left mark"
char_u2028 = "line separator"
char_u2029 = "paragraph separator"
char_u202f = "narrow no-break space"
char_u2060 = "word joiner"
char_u3000 = "full-width space"
char_ufeff = "zero-width no-break space"
char_u0300 = "grave accent"
char_u0301 = "acute accent"
char_u0302 = "circumflex"
char_u0303 = "tilde"
char_u0304 = "macron"
char_u0306 = "breve"
char_u0307 = "dot above"
char_u0308 = "umlaut"
char_u030a = "ring above"
char_u030b = "double acute accent"
char_u030c = "caron"
char_u0327 = "cedilla"
char_u0328 = "ogonek"
