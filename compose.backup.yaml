# A file of its own, not a profile, so the app can require the restore: an optional dependency that fails is skipped.
name: squidpdf

# compose.yaml's again: an anchor can't reach from one file into another.
x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  # A new volume takes its owner from the image that mounts it first, so make it the app's.
  accounts-owner:
    image: ghcr.io/kevinvle1997/squidpdf:${SQUIDPDF_TAG:-latest}
    command: ["true"]
    logging: *logging
    volumes:
      - accounts:/accounts
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true

  # Else the app would make an empty database, and Litestream copy it over the backup.
  restore:
    image: litestream/litestream:0.5.17
    command:
      [restore, -if-db-not-exists, -if-replica-exists, -o, /accounts/users.sqlite3,
       "${SQUIDPDF_BACKUP_URL:-}"]
    logging: *logging
    depends_on:
      accounts-owner:
        condition: service_completed_successfully
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${SQUIDPDF_BACKUP_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${SQUIDPDF_BACKUP_SECRET:-}
    user: "999:999"
    volumes:
      - accounts:/accounts
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true

  app:
    depends_on:
      restore:
        condition: service_completed_successfully

  backup:
    image: litestream/litestream:0.5.17
    restart: unless-stopped
    command: [replicate, /accounts/users.sqlite3, "${SQUIDPDF_BACKUP_URL:-}"]
    logging: *logging
    depends_on:
      app:
        condition: service_healthy
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${SQUIDPDF_BACKUP_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${SQUIDPDF_BACKUP_SECRET:-}
    user: "999:999"
    volumes:
      - accounts:/accounts
    # A file of a few people's addresses: far below what it may take.
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
