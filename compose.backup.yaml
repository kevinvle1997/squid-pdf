# The accounts' backup: a copy of their database in object storage, kept as it changes
# (Litestream), so a lost server loses no one's account. On with
# COMPOSE_FILE=compose.yaml:compose.backup.yaml in .env (env.example); a file of its own, not a
# profile, so the app can require the restore: an optional dependency that fails is skipped.
#
# In order: the volume made the app's, the copy put back where there's no database, the app,
# then the copying.
name: squidpdf

# As compose.yaml's: an anchor can't reach from one file into another.
x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  # A new volume takes its owner from the image that mounts it first: the app's, here, so
  # Litestream, running as the app's user, can write in it.
  accounts-owner:
    image: ghcr.io/kevinvle1997/squidpdf:${SQUIDPDF_TAG:-latest}
    command: ["true"]
    logging: *logging
    volumes:
      - accounts:/accounts
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true

  # Before the app starts, where the volume has no database: on a new server, or after the
  # volume was lost. Otherwise the app would make an empty one, and Litestream copy that over
  # the backup. With no backup yet, as on a first deploy, it does nothing; if it fails, with no
  # URL, a wrong key or the store out of reach, the app doesn't start.
  restore:
    image: litestream/litestream:0.5.17
    command:
      [restore, -if-db-not-exists, -if-replica-exists, -o, /accounts/users.sqlite3,
       "${SQUIDPDF_BACKUP_URL:-}"]
    logging: *logging
    depends_on:
      accounts-owner:
        condition: service_completed_successfully
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${SQUIDPDF_BACKUP_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${SQUIDPDF_BACKUP_SECRET:-}
    # The app's own user: the database it restores is the app's to write.
    user: "999:999"
    volumes:
      - accounts:/accounts
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true

  app:
    depends_on:
      restore:
        condition: service_completed_successfully

  # Copies each change to the URL .env names. The URL is an argument, not a settings file,
  # so the container stays read-only: Compose can't write a config into one.
  backup:
    image: litestream/litestream:0.5.17
    restart: unless-stopped
    command: [replicate, /accounts/users.sqlite3, "${SQUIDPDF_BACKUP_URL:-}"]
    logging: *logging
    depends_on:
      app:
        condition: service_healthy
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${SQUIDPDF_BACKUP_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${SQUIDPDF_BACKUP_SECRET:-}
    # The app's own user: the database is its, and Litestream writes its own files beside it.
    user: "999:999"
    volumes:
      - accounts:/accounts
    # A file of a few people's addresses, and its changes in flight: far below what it may take.
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
