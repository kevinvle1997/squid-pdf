# The Python side as every job needs it: uv, cached on the lockfile, and by default
# the environment the suite runs in (every extra, the dev tools). One copy, so the
# jobs can't drift into testing different environments.
name: uv
description: Install uv and sync the locked environment.

inputs:
  sync:
    description: What to install besides the locked base dependencies, as `uv sync` options.
    default: --all-extras

runs:
  using: composite
  steps:
    # The Dockerfile's uv, so CI runs the one the images do. Without a version, setup-uv
    # takes the newest that pyproject's `required-version` allows.
    - id: uv
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        version=$(sed -n 's|^COPY --from=ghcr.io/astral-sh/uv:\([0-9.]*\) .*|\1|p' Dockerfile)
        [[ -n $version ]] || { echo "no uv version in the Dockerfile's COPY --from line"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: astral-sh/setup-uv@v7
      with:
        version: ${{ steps.uv.outputs.version }}
        enable-cache: true
        cache-dependency-glob: uv.lock

    # From the root, even when the job's steps run in react/.
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: uv sync --locked ${{ inputs.sync }}
