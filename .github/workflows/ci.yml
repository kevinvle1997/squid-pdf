name: Lint and tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check src tests

      - name: Format
        run: uv run ruff format --check src tests

      - name: Types (mypy)
        run: uv run mypy src tests

      - name: Types (ty)
        run: uv run ty check

      - name: Test
        run: uv run pytest -q

  # Nothing else would notice if the Dockerfile stopped building.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t squidpdf .

      # The image's own command serves, so the suite is asked for by name.
      - name: Test inside the image
        run: docker run --rm squidpdf uv run pytest -q

  # The image served behind Caddy as deployed, with a password made here and
  # thrown away: the gate, an upload and an export, all through the proxy.
  serve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Throwaway password
        run: |
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          hash=$(docker run --rm caddy:2.11.4 caddy hash-password --plaintext "$password")
          printf "SQUIDPDF_DOMAIN=localhost\nSQUIDPDF_USER=ci\nSQUIDPDF_PASSWORD_HASH='%s'\n" "$hash" > .env
          echo "SQUIDPDF_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build
        run: docker compose build

      - name: Start
        run: |
          start=$(date +%s%N)
          docker compose up --detach --wait
          echo "STARTED_MS=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_ENV"
          # Caddy signs its own certificate for localhost; the check trusts its root.
          timeout 30 bash -c 'until docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt /tmp/root.crt; do sleep 1; done'

      # bash by name turns on pipefail, so a failed check isn't hidden by tee.
      - name: Check through the proxy
        shell: bash
        run: deploy/check.sh https://localhost ci "$SQUIDPDF_PASSWORD" /tmp/root.crt 2>&1 | tee /tmp/check.txt

      - name: Report
        run: |
          {
            echo '### Served behind the proxy'
            echo "Image: $(docker image inspect squidpdf --format '{{.Size}}' | numfmt --to=iec)"
            echo "Up and healthy in ${STARTED_MS} ms"
            echo '```'
            cat /tmp/check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: failure()
        run: docker compose logs

  # The one number the product is judged on. Runs against the generated fixture
  # here; the real answer comes from the corpus of ten real PDFs, which cannot
  # be committed because they are other people's documents.
  green-rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --locked

      - name: Report
        run: |
          uv run squidpdf fixture /tmp/sample.pdf
          uv run squidpdf report /tmp/sample.pdf | tee /tmp/report.txt
          {
            echo '### Green rate'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
