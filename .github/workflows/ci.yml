name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install
        uses: ./.github/actions/uv

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format
        run: uv run ruff format --check src tests scripts

      - name: Types (mypy)
        run: uv run mypy src tests scripts

      - name: Types (ty)
        run: uv run ty check

      # One worker per core. More is slower: the API's tests each start a process pool.
      - name: Test
        run: uv run pytest -q -n auto

  # Nothing else would notice the test image breaking; a slice of the suite proves it runs.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build
        run: docker build --target test -t squidpdf-test .

      - name: Test inside the image
        run: docker run --rm squidpdf-test uv run pytest -q tests/test_cli.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install the API
        uses: ./.github/actions/uv

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install
        run: npm ci

      # First: it needs neither the API nor a browser, so a lint failure costs seconds.
      - name: Lint and format
        run: npm run lint

      - name: Types match the API
        run: npm run types:check

      - name: Types (tsc)
        run: npm run typecheck

      - name: Playwright's version
        id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

      # Playwright pins its browsers, so its version alone decides what the cache holds.
      - name: Browser cache
        id: browser
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # No --with-deps: the runner ships Chrome, and with it Chromium's system libraries.
      - name: Chromium
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Unit and view tests
        run: npm test

      - name: End to end
        run: npm run e2e -- --project=chromium

      - name: Traces
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-traces-chromium
          path: react/test-results/

  # The tag a job's container runs is fixed before its steps, so it's read here.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: react/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Playwright's version
        id: version
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' react/package-lock.json)" >> "$GITHUB_OUTPUT"

  # In Playwright's own image, which ships WebKit with its system libraries, so no apt runs for them.
  webkit:
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # git refuses a checkout another user owns, and the build would then link main, not this commit.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the API
        uses: ./.github/actions/uv

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install
        run: npm ci

      - name: End to end
        run: npm run e2e -- --project=webkit

      - name: Traces
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-traces-webkit
          path: react/test-results/

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Domain
        run: echo 'SQUIDPDF_DOMAIN=localhost' > .env

      # The worst case for the runner's cores (env.example), which the runner's memory holds.
      - name: Memory for the runner's cores
        run: |
          cores=$(nproc)
          printf "SQUIDPDF_APP_MEMORY=%sm\nSQUIDPDF_APP_SCRATCH=%sm\n" \
            "$(( cores * 1792 + 1024 ))" "$(( cores * 256 ))" >> .env

      - name: Build
        run: SQUIDPDF_COMPOSE_HASH=$(deploy/check-compose.sh --hash) docker compose build
        # The landing links this commit's code (compose.yaml).
        env:
          SQUIDPDF_COMMIT: ${{ github.sha }}

      # The check a deploy runs before up, here so the image can't lose its label unnoticed.
      - name: The proxy names the compose.yaml it was built beside
        run: deploy/check-compose.sh

      - name: Start
        run: |
          start=$(date +%s%N)
          docker compose up --detach --wait
          echo "STARTED_MS=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_ENV"
          # Caddy signs its own certificate for localhost; the check trusts its root.
          timeout 30 bash -c 'until docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt /tmp/root.crt; do sleep 1; done'

      # bash by name turns on pipefail, so a failed check isn't hidden by tee.
      - name: Check through the proxy
        shell: bash
        run: |
          deploy/check.sh https://localhost /tmp/root.crt 2>&1 | tee /tmp/check.txt
          grep -q '^ok    the deployment names no terms' /tmp/check.txt

      - name: The containers' caps
        run: |
          cap=$(docker inspect "$(docker compose ps -q proxy)" --format '{{.HostConfig.NanoCpus}}')
          (( cap > 0 )) || { echo "the proxy runs with no CPU cap"; exit 1; }
          pids=$(docker inspect "$(docker compose ps -q app)" --format '{{.HostConfig.PidsLimit}}')
          [[ $pids =~ ^[1-9][0-9]*$ ]] || { echo "the app runs with no cap on its processes"; exit 1; }
          for service in app proxy; do
            driver=$(docker inspect "$(docker compose ps -q "$service")" --format '{{.HostConfig.LogConfig.Type}}')
            [[ $driver == local ]] || { echo "the $service's log goes to $driver, not the rotating local driver"; exit 1; }
          done

      - name: The proxy's Caddyfile is its own
        run: |
          caddy_mounts=$(docker inspect "$(docker compose ps -q proxy)" --format '{{range .Mounts}}{{println .Destination}}{{end}}' | grep '^/etc/caddy' || true)
          [[ -z $caddy_mounts ]] || { echo "the proxy reads $caddy_mounts from the host, not the Caddyfile built into it"; exit 1; }

      # In different /64s, which the rate limit counts apart.
      - name: IPv6 clients count apart
        run: |
          first=fd8b:2c41:e0d5:1::1
          second=fd8b:2c41:e0d5:2::1
          sudo ip -6 addr add "$first/128" dev lo
          sudo ip -6 addr add "$second/128" dev lo
          # An empty upload is counted before its body is read, and costs the app nothing.
          upload_from() {
            curl --silent --output /dev/null --write-out '%{http_code}' --cacert /tmp/root.crt \
              --interface "$1" --resolve "localhost:443:[$1]" \
              --header 'content-type: application/pdf' --data-binary '' https://localhost/api/documents || true
          }
          # What the app answers an empty upload it lets in; 000, had curl not reached it.
          let_in=$(upload_from "$first")
          [[ $let_in =~ ^4 && $let_in != 429 ]] || { echo "an empty upload answered $let_in"; exit 1; }
          for _ in $(seq 100); do
            status=$(upload_from "$first")
            [[ $status == 429 ]] && break
          done
          [[ $status == 429 ]] || { echo "100 uploads from $first were never refused"; exit 1; }
          status=$(upload_from "$second")
          [[ $status == "$let_in" ]] || { echo "$second answered $status, not $let_in: one count"; exit 1; }
          echo "$first used up its uploads; $second, in another /64, was still let in"

      # As a deployer names terms (compose.yaml): checked by the app's own user, as it will
      # read them, then served through the proxy once the app takes them in.
      - name: Terms, checked and served
        shell: bash
        run: |
          echo 'SQUIDPDF_TERMS=./fixtures/terms.md' >> .env
          docker compose run --rm --no-deps app squidpdf terms
          docker compose up --detach --wait
          deploy/check.sh https://localhost /tmp/root.crt 2>&1 | tee /tmp/check-terms.txt
          grep -q '^ok    the terms are served: Example terms' /tmp/check-terms.txt

      # As a deployer opens to invited people (env.example): no mail server is reached, as a
      # stranger's address gets no link, and invite.sh and remove.sh write the accounts volume.
      - name: Invite only, checked
        shell: bash
        run: |
          secret=$(openssl rand -base64 32)
          echo "::add-mask::$secret"
          {
            echo "SQUIDPDF_SECRET=$secret"
            printf 'SQUIDPDF_SMTP_%s\n' HOST=mail.invalid PORT=587 SECURITY=starttls USER=ci PASSWORD=unused
            echo 'SQUIDPDF_MAIL_FROM=sign-in@example.com'
            echo 'SQUIDPDF_INVITE_ONLY=yes'
          } >> .env
          docker compose up --detach --wait
          deploy/invite.sh --unlimited friend@example.com family@example.com
          # Each refused for its own reason, said: any other failure, a dead container say, isn't one.
          refused=$(deploy/invite.sh not-an-address 2>&1) && { echo "invite.sh let in what isn't an address"; exit 1; }
          grep -q "isn't an email address" <<<"$refused" || { echo "invite.sh failed otherwise: $refused"; exit 1; }
          deploy/remove.sh family@example.com
          refused=$(deploy/remove.sh family@example.com 2>&1) && { echo "remove.sh took off an account twice"; exit 1; }
          grep -q "has no account here" <<<"$refused" || { echo "remove.sh failed otherwise: $refused"; exit 1; }
          deploy/check.sh https://localhost /tmp/root.crt 2>&1 | tee /tmp/check-invited.txt
          grep -q "^ok    invite-only: a stranger's upload is refused" /tmp/check-invited.txt

      # As a deployer turns the backup on (env.example), to a folder on the runner in place of a
      # bucket: the same services and Litestream, one replica kind apart. The accounts volume is
      # then lost on purpose, and a plain `up` has to put it back, or not start the app.
      - name: Accounts, backed up and restored
        shell: bash
        run: |
          mkdir -m 777 /tmp/ci-backups
          mount='    volumes: ["/tmp/ci-backups:/backups"]'
          printf 'services:\n  restore:\n%s\n  backup:\n%s\n' "$mount" "$mount" > /tmp/backup-ci.yaml
          {
            echo 'COMPOSE_FILE=compose.yaml:compose.backup.yaml:/tmp/backup-ci.yaml'
            echo 'SQUIDPDF_BACKUP_URL=file:///backups/accounts'
          } >> .env
          docker compose up --detach --wait
          emails() { docker compose exec -T backup sqlite3 -readonly /accounts/users.sqlite3 'select email from users'; }
          copied() { find /tmp/ci-backups -type f -printf '%s %p\n' | sort | sha256sum; }
          # A quiet spell first, so a change after the invite is more likely its own; the restore
          # below, which needs kept@ back, is what proves it was copied.
          for _ in $(seq 15); do was=$(copied); sleep 2; [[ $(copied) == "$was" ]] && break; done
          before=$(copied)
          deploy/invite.sh kept@example.com
          for _ in $(seq 30); do [[ $(copied) != "$before" ]] && break; sleep 1; done
          [[ $(copied) != "$before" ]] || { echo "Litestream copied nothing of the invite in 30s"; exit 1; }
          docker compose down
          docker volume rm squidpdf_accounts
          # A copy it can't read: the restore fails, so the app never makes an empty database.
          chmod 000 /tmp/ci-backups
          if docker compose up --detach 2>/tmp/up-unread.txt; then echo "up started with no copy to restore"; exit 1; fi
          tail -n 5 /tmp/up-unread.txt
          running=$(docker compose ps --status running --services)
          grep -qx app <<<"$running" && { echo "the app started though the restore failed"; exit 1; }
          chmod 777 /tmp/ci-backups
          docker compose up --detach --wait
          restored=$(emails)
          for email in friend@example.com kept@example.com; do
            grep -qx "$email" <<<"$restored" || { echo "the restored accounts lack $email: $restored"; exit 1; }
          done
          # Over a database that's there, a later up keeps what the copy hasn't got.
          docker compose stop backup
          deploy/invite.sh later@example.com
          docker compose up --detach --wait --force-recreate
          grep -qx later@example.com <<<"$(emails)" || { echo "a later up restored over the database"; exit 1; }
          deploy/check.sh https://localhost /tmp/root.crt

      # Only a push to main publishes, so only it keeps what it checked, for publish to push.
      # bash by name turns on pipefail, so a failed save isn't hidden by zstd.
      - name: Save the checked images
        if: github.repository == 'kevinvle1997/squid-pdf' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # The images publish pushes: compose.yaml's, not the backup's Litestream.
          mapfile -t images < <(COMPOSE_FILE=compose.yaml docker compose config --images)
          docker save "${images[@]}" | zstd -T0 -o /tmp/images.tar.zst

      - name: Upload the checked images
        if: github.repository == 'kevinvle1997/squid-pdf' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: checked-images
          path: /tmp/images.tar.zst
          if-no-files-found: error
          # Already zstd: zipping it again would cost time and win nothing.
          compression-level: 0
          # A re-run of this job replaces the last attempt's, rather than failing on its name.
          overwrite: true
          # Publish reads it minutes later; a day still leaves room to re-run publish.
          retention-days: 1

      - name: Report
        run: |
          {
            echo '### Served behind the proxy'
            echo "Image: $(docker image inspect "$(COMPOSE_FILE=compose.yaml docker compose config --images app)" --format '{{.Size}}' | numfmt --to=iec)"
            echo "Up and healthy in ${STARTED_MS} ms"
            echo '```'
            cat /tmp/check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: failure()
        run: docker compose logs

  # The one number the product is judged on, here on the fixture: the real PDFs can't be
  # committed, since they are other people's documents.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The CLI as a user installs it: no `api` extra and no dev tools, so it proves it runs
      # without them. `uv run --no-dev` keeps them out, where plain `uv run` would add the tools.
      - name: Install
        uses: ./.github/actions/uv
        with:
          sync: --no-dev

      # bash by name turns on pipefail, so a report that measured nothing isn't hidden by tee.
      - name: Green rate
        shell: bash
        run: |
          uv run --no-dev squidpdf fixture /tmp/sample.pdf
          uv run --no-dev squidpdf report /tmp/sample.pdf | tee /tmp/report.txt
          {
            echo '### Green rate'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # What a deploy pulls (compose.yaml): images from a commit every job above passed on.
  publish:
    if: github.repository == 'kevinvle1997/squid-pdf' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, image, frontend, webkit, deploy, report]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # Compose won't load its file without these; only the tag names the images.
    env:
      SQUIDPDF_TAG: ${{ github.sha }}
      SQUIDPDF_DOMAIN: unused
      SQUIDPDF_APP_MEMORY: 1g
      SQUIDPDF_APP_SCRATCH: 1m
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Not a rebuild: that may pull a moved base tag, and its layers would be new bytes.
      - name: Download the checked images
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: checked-images
          path: /tmp

      # Deploy built them under compose's default tag, latest; what this job pushes is the commit's.
      - name: Load the checked images
        shell: bash
        run: |
          zstd --decompress --stdout /tmp/images.tar.zst | docker load
          mapfile -t images < <(docker compose config --images)
          for image in "${images[@]}"; do
            docker tag "${image%:*}:latest" "$image"
          done

      - name: Sign in to the registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: docker compose push

      # Only from main's tip, so a re-run of an older run can't move latest back.
      - name: Push as latest
        run: |
          tip=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          [[ $tip == "$GITHUB_SHA" ]] || { echo "main has moved on to $tip; latest stays"; exit 0; }
          mapfile -t images < <(docker compose config --images)
          for image in "${images[@]}"; do
            docker tag "$image" "${image%:*}:latest"
            docker push "${image%:*}:latest"
          done
