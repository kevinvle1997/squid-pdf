name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install
        uses: ./.github/actions/uv

      - name: Lint
        run: uv run ruff check src tests

      - name: Format
        run: uv run ruff format --check src tests

      - name: Types (mypy)
        run: uv run mypy src tests

      - name: Types (ty)
        run: uv run ty check

      # One worker per core. More is slower: the API's tests each start a process pool.
      - name: Test
        run: uv run pytest -q -n auto

  # Nothing else would notice if the test image stopped building. The suite itself
  # runs in `backend`; here a slice of it proves the tools, tests and fixtures made it in.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build --target test -t squidpdf-test .

      - name: Test inside the image
        run: docker run --rm squidpdf-test uv run pytest -q tests/test_cli.py

  # The browser app: its types are the API's OpenAPI, it typechecks, its unit
  # tests pass, and the core loop works end to end in Chromium against the real API.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v5

      - name: Install the API
        uses: ./.github/actions/uv

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install
        run: npm ci

      - name: Types match the API
        run: npm run types:check

      - name: Types (tsc)
        run: npm run typecheck

      # The lockfile pins Playwright, and Playwright pins its Chromium.
      - name: Browser cache
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('react/package-lock.json') }}

      # Before the tests: the view's tests run in Chromium too.
      - name: Browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The system libraries it needs live outside the cache, so a hit still installs them.
      - name: Browser's system libraries
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Unit and view tests
        run: npm test

      - name: End to end
        run: npm run e2e

      - name: Traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: react/test-results/

  # The image served behind Caddy as deployed, with a password made here and
  # thrown away: the gate, an upload and an export, all through the proxy.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Hashed by the Caddy the proxy is built on, named once in react/Dockerfile.
      - name: Throwaway password
        run: |
          caddy=$(sed -n 's/^FROM \(caddy:.*\)/\1/p' react/Dockerfile)
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          hash=$(docker run --rm "$caddy" caddy hash-password --plaintext "$password")
          printf "SQUIDPDF_DOMAIN=localhost\nSQUIDPDF_USER=ci\nSQUIDPDF_PASSWORD_HASH='%s'\n" "$hash" > .env
          echo "SQUIDPDF_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build
        run: docker compose build

      - name: Start
        run: |
          start=$(date +%s%N)
          docker compose up --detach --wait
          echo "STARTED_MS=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_ENV"
          # Caddy signs its own certificate for localhost; the check trusts its root.
          timeout 30 bash -c 'until docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt /tmp/root.crt; do sleep 1; done'

      # bash by name turns on pipefail, so a failed check isn't hidden by tee.
      - name: Check through the proxy
        shell: bash
        run: deploy/check.sh https://localhost ci /tmp/root.crt 2>&1 | tee /tmp/check.txt

      - name: Report
        run: |
          {
            echo '### Served behind the proxy'
            echo "Image: $(docker image inspect squidpdf --format '{{.Size}}' | numfmt --to=iec)"
            echo "Up and healthy in ${STARTED_MS} ms"
            echo '```'
            cat /tmp/check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: failure()
        run: docker compose logs

  # The one number the product is judged on. Runs against the generated fixture
  # here; the real answer comes from the corpus of ten real PDFs, which cannot
  # be committed because they are other people's documents.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install
        uses: ./.github/actions/uv

      - name: Green rate
        run: |
          uv run squidpdf fixture /tmp/sample.pdf
          uv run squidpdf report /tmp/sample.pdf | tee /tmp/report.txt
          {
            echo '### Green rate'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
