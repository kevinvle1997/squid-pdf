name: Lint and tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check src tests

      - name: Format
        run: uv run ruff format --check src tests

      - name: Types
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest -q

  # The one number the product is judged on. Runs against the generated fixture
  # here; the real answer comes from the corpus of ten real PDFs, which cannot
  # be committed because they are other people's documents.
  # Nothing else would notice if the Dockerfile stopped building.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t squidpdf .

      - name: Test inside the image
        run: docker run --rm squidpdf

  green-rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --locked

      - name: Report
        run: |
          uv run squidpdf fixture /tmp/sample.pdf
          uv run squidpdf report /tmp/sample.pdf | tee /tmp/report.txt
          {
            echo '### Green rate'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
