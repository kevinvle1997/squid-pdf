name: Audit

# Not a job of CI's: a new advisory would fail every PR, and hold the images main publishes.
on:
  schedule:
    - cron: "17 9 * * *"
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/audit.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install
        uses: ./.github/actions/uv

      - name: Known vulnerabilities
        run: uv audit --locked --preview-features audit-command
