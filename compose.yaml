# The app behind Caddy, as deployed: `docker compose up -d`, with a .env beside
# this file (copy env.example). .env holds the domain, the password hash and
# the app's memory, and is never committed.
name: squidpdf

services:
  app:
    build: .
    image: squidpdf
    restart: unless-stopped
    # Reaps the pool's exited helper processes and passes stop signals on.
    init: true
    environment:
      # Caddy's X-Forwarded-For names the address Caddy sees: the app believes it from
      # Caddy's address alone (below), so nothing else that reaches the app can fake the
      # address it limits. The network below is IPv4 alone, so an IPv6 client reaches Caddy
      # through Docker's proxy and is seen as the network's gateway, one address for all.
      # Not in the image: run alone with its port open, anyone could fake the header.
      FORWARDED_ALLOW_IPS: 172.31.255.2
    volumes:
      - documents:/data
    # No ports: only Caddy, on this network, reaches the app.
    # The whole app's memory: one worker a core of the host, each capped at 1 GiB
    # (api/constants.py), /tmp's files, and the server's own process, which also holds each
    # export's bytes as its worker sends them back. It is what the host can give the app
    # beside Caddy and the system, so .env sets it (env.example says how). No default: one
    # sized for a larger host never binds on a smaller one, where the host runs out first
    # and its own out-of-memory killer stops any process, Caddy included. Under a limit that
    # binds, the kernel kills the app's largest process: most often a worker at its cap,
    # whose task alone fails and which the pool replaces (api/pool.py). If it kills the main
    # process instead, the container restarts.
    mem_limit: ${SQUIDPDF_APP_MEMORY:?set it in .env from the host's memory, as env.example says}
    # It needs no privilege: it runs as its own user, on a port above 1024.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Nothing in the image is written: documents go to /data, and an export is saved in /tmp
    # while it's made, at most one a worker, so /tmp's size follows the cores too.
    read_only: true
    tmpfs:
      - /tmp:size=${SQUIDPDF_APP_SCRATCH:?set it in .env from the host's cores, as env.example says}

  # Caddy, with the browser app built into it: see react/Dockerfile.
  proxy:
    build:
      context: .
      dockerfile: react/Dockerfile
    image: squidpdf-proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80" # the certificate challenge, and the redirect to https
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SQUIDPDF_DOMAIN: ${SQUIDPDF_DOMAIN:?set it in .env}
      SQUIDPDF_USER: ${SQUIDPDF_USER:?set it in .env}
      SQUIDPDF_PASSWORD_HASH: ${SQUIDPDF_PASSWORD_HASH:?set it in .env}
    networks:
      default:
        # Fixed, so the app knows which address is Caddy's.
        ipv4_address: 172.31.255.2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Its certificates. Kept, so a restart doesn't ask the CA for new ones.
      - caddy-data:/data
      - caddy-config:/config
    # It streams bodies through rather than holding them.
    mem_limit: 512m
    # Only the right to listen on 80 and 443: its program carries it, and won't start without.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    # It writes only its certificates and config, to the volumes above.
    read_only: true

networks:
  default:
    ipam:
      config:
        # A range of its own, so Caddy's address is known. Others get theirs from the top
        # half, so none can take Caddy's before it starts.
        - subnet: 172.31.255.0/24
          ip_range: 172.31.255.128/25

volumes:
  # Uploaded documents, each deleted after an hour untouched.
  documents:
  caddy-data:
  caddy-config:
