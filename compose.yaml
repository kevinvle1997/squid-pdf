# The app behind Caddy, as deployed, with a .env beside this file, filled in from
# env.example and never committed.
#
# A deploy or a rollback is one tag: SQUIDPDF_TAG in .env set to a commit on main, as
# env.example says, then the images CI built and checked for it:
#   docker compose pull && deploy/check-compose.sh && docker compose up -d --no-build
# The Caddyfile is built into the proxy image, so its policy moves with the app it allows.
# The checkout moves only when this file or env.example changed: the check then stops the
# deploy and says so, as the proxy image names the two it was built beside.
# An image older than the check names neither, so it's refused: its own commit's header deploys it.
# --no-build: a missing image fails, rather than building on the server beside the app.
# To roll back, name an earlier commit the package pages list: not every one has images.
# Once, after the first publish, make both packages public on ghcr.io; until then a pull is
# denied, unless the server signs in (`docker login ghcr.io`) with a read:packages token.
# Or build from source, tagged apart from the registry's, naming the commit the landing links.
# The Caddyfile is then built in too, so a change to it needs this again:
#   SQUIDPDF_TAG=local SQUIDPDF_COMMIT=$(git rev-parse HEAD) docker compose up -d --build
# The published images are linux/amd64; another architecture builds from source.
#
# The service's terms, which the landing links, are a file on the server that .env names, as
# env.example says. The app reads it as it starts and won't start on terms its page can't show,
# so check the file first, while the running app still serves:
#   docker compose run --rm --no-deps app squidpdf terms
# Then `docker compose restart app` takes in a changed file, and `up -d` one newly named in .env.
# Inside the app it's /etc/squidpdf/terms.md, the name the check and the app's log give it.
#
# The accounts' database is the one thing here worth a backup; with COMPOSE_PROFILES=backup in
# .env, Litestream keeps a copy of it in object storage, and `up` puts it back by itself where
# the accounts volume has none: on a new server, or after the volume was lost.
#
# The host's Docker needs ip6tables on, the default from Docker 27. Without it, a
# published port hands every IPv6 client on from one address, and they share one count.
name: squidpdf

# Each service's log rotates: Docker's default keeps it forever, and the app writes a line a
# request, so it would grow until the free-space floor (`MIN_FREE_BYTES`) turns uploads away.
x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  app:
    build: .
    image: ghcr.io/kevinvle1997/squidpdf:${SQUIDPDF_TAG:-latest}
    # Where the backup is on, the accounts are put back before the app makes a database of its
    # own; where it's off, there's no such service, and nothing waits.
    depends_on:
      restore:
        condition: service_completed_successfully
        required: false
    restart: unless-stopped
    logging: *logging
    # Reaps the pool's exited helper processes and passes stop signals on.
    init: true
    # On a stop, requests under way finish, then the pool stops its workers. Docker's default
    # 10s would cut an export, which may take a minute (`EXPORT_TIMEOUT_S`).
    stop_grace_period: 90s
    environment:
      # The app believes X-Forwarded-For from Caddy alone, so no one else can fake an address.
      # Not in the image: run alone with its port open, anyone could fake the header.
      FORWARDED_ALLOW_IPS: 172.31.255.2,fd52:74a:91b1::2
      # The terms file .env names, mounted below; empty when it names none, so the app has none.
      SQUIDPDF_TERMS: ${SQUIDPDF_TERMS:+/etc/squidpdf/terms.md}
      # Accounts where .env sets a secret, kept in the volume below; none where it sets none.
      SQUIDPDF_DATABASE: ${SQUIDPDF_SECRET:+/accounts/users.sqlite3}
      SQUIDPDF_SECRET: ${SQUIDPDF_SECRET:-}
      SQUIDPDF_SITE: https://${SQUIDPDF_DOMAIN:?set it in .env}
      SQUIDPDF_SMTP_HOST: ${SQUIDPDF_SMTP_HOST:-}
      SQUIDPDF_SMTP_PORT: ${SQUIDPDF_SMTP_PORT:-}
      SQUIDPDF_SMTP_SECURITY: ${SQUIDPDF_SMTP_SECURITY:-}
      SQUIDPDF_SMTP_USER: ${SQUIDPDF_SMTP_USER:-}
      SQUIDPDF_SMTP_PASSWORD: ${SQUIDPDF_SMTP_PASSWORD:-}
      SQUIDPDF_MAIL_FROM: ${SQUIDPDF_MAIL_FROM:-}
      SQUIDPDF_INVITE_ONLY: ${SQUIDPDF_INVITE_ONLY:-}
      SQUIDPDF_FREE_DOCUMENTS: ${SQUIDPDF_FREE_DOCUMENTS:-}
      SQUIDPDF_DOCUMENTS_A_MONTH: ${SQUIDPDF_DOCUMENTS_A_MONTH:-}
    volumes:
      - documents:/data
      - accounts:/accounts
      # Compose can't leave a mount out, so with no terms named it mounts an empty file, never read.
      # Never made where it's missing, as Docker would make a folder: `up` stops and says so.
      - type: bind
        source: ${SQUIDPDF_TERMS:-/dev/null}
        target: /etc/squidpdf/terms.md
        read_only: true
        bind:
          create_host_path: false
    # No ports: only Caddy, on this network, reaches the app.
    # The app's whole memory, /tmp included: no default, as it follows the host (env.example).
    mem_limit: ${SQUIDPDF_APP_MEMORY:?set it in .env from the host's memory, as env.example says}
    # It needs no privilege: it runs as its own user, on a port above 1024.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Far above the app's own threads and workers, far below a parser bug that forks without
    # end: that stops here, not at the host's limit, where Caddy and sshd couldn't fork either.
    pids_limit: 1024
    # Only /data, /accounts and /tmp are written; /tmp holds an export a worker, so it's sized by cores.
    read_only: true
    tmpfs:
      - /tmp:size=${SQUIDPDF_APP_SCRATCH:?set it in .env from the host's cores, as env.example says}

  # The backup, with COMPOSE_PROFILES=backup in .env (env.example): a copy of the accounts'
  # database in object storage, kept as it changes (Litestream), so a lost server loses no
  # one's account. Three services, in order: the volume made the app's, the copy put back
  # where there's no database, then, with the app up, the copying.
  #
  # A new volume takes its owner from the image that mounts it first: the app's, here, so
  # Litestream, running as the app's user, can write in it.
  accounts-owner:
    image: ghcr.io/kevinvle1997/squidpdf:${SQUIDPDF_TAG:-latest}
    profiles: [backup]
    command: ["true"]
    logging: *logging
    volumes:
      - accounts:/accounts
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true

  # Before the app starts, where the volume has no database: on a new server, or after the
  # volume was lost. Otherwise the app would make an empty one, and Litestream copy that
  # over the backup. With no backup yet, as on the first deploy, it does nothing; with no
  # URL, it fails, and the app doesn't start, so a backup turned on is never skipped unseen.
  restore:
    image: litestream/litestream:0.5.17
    profiles: [backup]
    command:
      [restore, -if-db-not-exists, -if-replica-exists, -o, /accounts/users.sqlite3,
       "${SQUIDPDF_BACKUP_URL:-}"]
    logging: *logging
    depends_on:
      accounts-owner:
        condition: service_completed_successfully
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${SQUIDPDF_BACKUP_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${SQUIDPDF_BACKUP_SECRET:-}
    # The app's own user: the database it restores is the app's to write.
    user: "999:999"
    volumes:
      - accounts:/accounts
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true

  # Copies each change to the URL .env names. The URL is an argument, not a settings file,
  # so the container stays read-only: Compose can't write a config into one.
  backup:
    image: litestream/litestream:0.5.17
    profiles: [backup]
    restart: unless-stopped
    command: [replicate, /accounts/users.sqlite3, "${SQUIDPDF_BACKUP_URL:-}"]
    logging: *logging
    depends_on:
      app:
        condition: service_healthy
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${SQUIDPDF_BACKUP_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${SQUIDPDF_BACKUP_SECRET:-}
    # The app's own user: the database is its, and Litestream writes its own files beside it.
    user: "999:999"
    volumes:
      - accounts:/accounts
    # A file of a few people's addresses, and its changes in flight: far below what it may take.
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true

  # Caddy, with the browser app built into it: see react/Dockerfile.
  proxy:
    build:
      context: .
      dockerfile: react/Dockerfile
      # Unset, the landing links the repository's main branch, and the build says so.
      args:
        SQUIDPDF_COMMIT: ${SQUIDPDF_COMMIT:-}
        # Unset, deploy/check-compose.sh refuses the image: CI sets it from its checkout.
        SQUIDPDF_COMPOSE_HASH: ${SQUIDPDF_COMPOSE_HASH:-}
    image: ghcr.io/kevinvle1997/squidpdf-proxy:${SQUIDPDF_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80" # the certificate challenge, and the redirect to https
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SQUIDPDF_DOMAIN: ${SQUIDPDF_DOMAIN:?set it in .env}
    networks:
      default:
        # Fixed, so the app knows which addresses are Caddy's.
        ipv4_address: 172.31.255.2
        ipv6_address: fd52:74a:91b1::2
    volumes:
      # Its certificates. Kept, so a restart doesn't ask the CA for new ones.
      - caddy-data:/data
      - caddy-config:/config
    # It streams bodies through rather than holding them.
    mem_limit: 512m
    # A core at most: a flood of TLS handshakes costs Caddy, so it can't take the app's cores.
    cpus: 1
    # Only the right to listen on 80 and 443: its program carries it, and won't start without.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    # It writes only its certificates and config, to the volumes above.
    read_only: true

networks:
  default:
    # So Caddy sees each IPv6 client's own address, and the app counts it by its /64.
    enable_ipv6: true
    ipam:
      config:
        # Other containers draw from the top half, so none takes Caddy's address before it starts.
        - subnet: 172.31.255.0/24
          ip_range: 172.31.255.128/25
        # A private range (ULA), drawn at random as RFC 4193 asks, halved the same way.
        - subnet: fd52:74a:91b1::/64
          ip_range: fd52:74a:91b1:0:8000::/65

volumes:
  # Uploaded documents, each deleted after an hour untouched.
  documents:
  # Accounts: each person's address, kept until taken off. The one volume worth a backup.
  accounts:
  caddy-data:
  caddy-config:
