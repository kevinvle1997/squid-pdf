# The app behind Caddy, with a .env beside this file filled in from env.example, never committed.
#
# A deploy or a rollback is one tag: SQUIDPDF_TAG in .env set to a commit on main, then
#   docker compose pull && deploy/check-compose.sh && docker compose up -d --no-build
# The check refuses an image built beside another compose.yaml, compose.backup.yaml or
# env.example; --no-build fails on a missing image rather than build beside the app.
# Not every commit has images: roll back to one the package pages list. Until both packages
# are made public on ghcr.io, a pull needs `docker login ghcr.io` with a read:packages token.
# From source (also the way to another architecture than linux/amd64), tagged apart:
#   SQUIDPDF_TAG=local SQUIDPDF_COMMIT=$(git rev-parse HEAD) docker compose up -d --build
#
# The terms .env names are read as the app starts, and it won't start on terms it can't show:
#   docker compose run --rm --no-deps app squidpdf terms   # check first, while the old app serves
# then `docker compose restart app` for a changed file, or `up -d` for one newly named.
#
# The accounts' database is the one thing worth a backup: compose.backup.yaml (env.example).
#
# The host's Docker needs ip6tables on, or every IPv6 client shares one address and one count.
name: squidpdf

# Docker's default keeps a log forever, until the free-space floor (`MIN_FREE_BYTES`) turns uploads away.
x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  app:
    build: .
    image: ghcr.io/kevinvle1997/squidpdf:${SQUIDPDF_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    init: true
    # Docker's default 10s would cut an export, which may take a minute (`EXPORT_TIMEOUT_S`).
    stop_grace_period: 90s
    environment:
      # Caddy's alone; not in the image, where anyone could fake the header.
      FORWARDED_ALLOW_IPS: 172.31.255.2,fd52:74a:91b1::2
      SQUIDPDF_TERMS: ${SQUIDPDF_TERMS:+/etc/squidpdf/terms.md}
      SQUIDPDF_DATABASE: ${SQUIDPDF_SECRET:+/accounts/users.sqlite3}
      SQUIDPDF_SECRET: ${SQUIDPDF_SECRET:-}
      SQUIDPDF_SITE: https://${SQUIDPDF_DOMAIN:?set it in .env}
      SQUIDPDF_SMTP_HOST: ${SQUIDPDF_SMTP_HOST:-}
      SQUIDPDF_SMTP_PORT: ${SQUIDPDF_SMTP_PORT:-}
      SQUIDPDF_SMTP_SECURITY: ${SQUIDPDF_SMTP_SECURITY:-}
      SQUIDPDF_SMTP_USER: ${SQUIDPDF_SMTP_USER:-}
      SQUIDPDF_SMTP_PASSWORD: ${SQUIDPDF_SMTP_PASSWORD:-}
      SQUIDPDF_MAIL_FROM: ${SQUIDPDF_MAIL_FROM:-}
      SQUIDPDF_BREVO_KEY: ${SQUIDPDF_BREVO_KEY:-}
      SQUIDPDF_BREVO_WEBHOOK_TOKEN: ${SQUIDPDF_BREVO_WEBHOOK_TOKEN:-}
      SQUIDPDF_INVITE_ONLY: ${SQUIDPDF_INVITE_ONLY:-}
      SQUIDPDF_FREE_DOCUMENTS: ${SQUIDPDF_FREE_DOCUMENTS:-}
      SQUIDPDF_DOCUMENTS_A_MONTH: ${SQUIDPDF_DOCUMENTS_A_MONTH:-}
      SQUIDPDF_STRIPE_KEY: ${SQUIDPDF_STRIPE_KEY:-}
      SQUIDPDF_STRIPE_WEBHOOK_SECRET: ${SQUIDPDF_STRIPE_WEBHOOK_SECRET:-}
      SQUIDPDF_STRIPE_PRICE: ${SQUIDPDF_STRIPE_PRICE:-}
    volumes:
      - documents:/data
      - accounts:/accounts
      # Compose can't leave a mount out, so no terms mounts /dev/null; a missing file would become a folder.
      - type: bind
        source: ${SQUIDPDF_TERMS:-/dev/null}
        target: /etc/squidpdf/terms.md
        read_only: true
        bind:
          create_host_path: false
    # /tmp included; no default, as it follows the host.
    mem_limit: ${SQUIDPDF_APP_MEMORY:?set it in .env from the host's memory, as env.example says}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Far above the app's own threads and workers, far below a parser bug that forks without end.
    pids_limit: 1024
    # /tmp holds an export a worker, so it's sized by cores.
    read_only: true
    tmpfs:
      - /tmp:size=${SQUIDPDF_APP_SCRATCH:?set it in .env from the host's cores, as env.example says}

  proxy:
    build:
      context: .
      dockerfile: react/Dockerfile
      args:
        SQUIDPDF_COMMIT: ${SQUIDPDF_COMMIT:-}
        # Unset, deploy/check-compose.sh refuses the image: CI sets it from its checkout.
        SQUIDPDF_COMPOSE_HASH: ${SQUIDPDF_COMPOSE_HASH:-}
    image: ghcr.io/kevinvle1997/squidpdf-proxy:${SQUIDPDF_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SQUIDPDF_DOMAIN: ${SQUIDPDF_DOMAIN:?set it in .env}
    networks:
      default:
        # Fixed, so the app knows which addresses are Caddy's (FORWARDED_ALLOW_IPS).
        ipv4_address: 172.31.255.2
        ipv6_address: fd52:74a:91b1::2
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    # It streams bodies through rather than holding them.
    mem_limit: 512m
    # A flood of TLS handshakes can't take the app's cores.
    cpus: 1
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true

networks:
  default:
    # So Caddy sees each IPv6 client's own address, and the app counts it by its /64.
    enable_ipv6: true
    ipam:
      config:
        # Others draw from the top half, so none takes Caddy's address before it starts.
        - subnet: 172.31.255.0/24
          ip_range: 172.31.255.128/25
        - subnet: fd52:74a:91b1::/64
          ip_range: fd52:74a:91b1:0:8000::/65

volumes:
  documents:
  accounts:
  caddy-data:
  caddy-config:
