[project]
name = "squidpdf"
version = "0.1.0"
description = "Correct text already in a PDF, and know beforehand whether it will look identical."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    # Caches are keyed on MuPDF's version (BUILD), so move this pin on purpose.
    "pymupdf>=1.28.2,<1.29",
    "fonttools>=4.53",
    "httpx>=0.28",
    "orjson>=3.10",
    "zlib-ng>=1.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "xxhash>=3.5",
    "pebble>=5.2",
]

[project.scripts]
squidpdf = "squidpdf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.7",
    "mypy>=1.13",
    # Pre-1.0: its checks change between releases, so move this pin on purpose.
    "ty==0.0.84",
    "squidpdf[api]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Older uv settles for Python 3.14.0rc2, where pydantic fails on import.
required-version = ">=0.9"
python-preference = "only-managed"

[tool.hatch.build.targets.wheel]
packages = ["src/squidpdf"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
# Rules held: BLE broad except says why; RUF100 no stale noqa; TID MuPDF's low-level API in lowlevel/;
# RUF001-3 no look-alike characters; PLR0917 keyword-only past three; S101 no bare assert;
# RET505/506 no else after return; PLR2004 named constants; ASYNC no blocking on the loop;
# PLC2701 no other module's _name (a preview rule: check it on each ruff upgrade).
select = [
    "E", "F", "I", "UP", "B", "BLE", "RUF001", "RUF002", "RUF003", "RUF100", "TID",
    "PLR0917", "S101", "RET505", "RET506", "PLR2004", "ASYNC", "PLC2701",
]
preview = true
explicit-preview-rules = true
# Our timeouts go to the pool, which kills a worker at its deadline; asyncio's can't stop a process.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0917", "PLR2004", "ASYNC110"]
"tests/helpers.py" = ["S101"]
"src/squidpdf/core/pdf/lowlevel/**" = ["TID251"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pylint]
max-positional-args = 3

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pymupdf.mupdf".msg = "MuPDF's low-level API lives in core/pdf/lowlevel/; add a method to the part for its concern."

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
    # Made an error, it's raised inside PyMuPDF's start-up, which then hangs (macOS).
    "ignore:builtin type (swigvarlink|SwigPyObject|SwigPyPacked) has no __module__ attribute:DeprecationWarning",
]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "scripts"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pymupdf.*", "fontTools.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "squidpdf.*"
disallow_untyped_defs = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "scripts"]
