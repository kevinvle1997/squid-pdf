[project]
name = "squidpdf"
version = "0.1.0"
description = "Correct text already in a PDF, and know beforehand whether it will look identical."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    # The version the suite passes on: older ones name fonts and embed them differently.
    # Caches are keyed on MuPDF's version (BUILD), so move this pin on purpose, like ty's.
    "pymupdf>=1.28.2,<1.29",
    "fonttools>=4.53",
    "httpx>=0.28",  # fetches Google's copy of a font, in the CLI as in the app
    "orjson>=3.10",  # the document store's files; the CLI imports the store
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "xxhash>=3.5",
    "pebble>=5.2",
]

[project.scripts]
squidpdf = "squidpdf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",  # CI runs the suite across the runner's cores
    "ruff>=0.7",
    "mypy>=1.13",
    # Pre-1.0: its checks change between releases, so move this pin on purpose.
    "ty==0.0.84",
    # The API's tests need it, and the CLI must still run without it.
    "squidpdf[api]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# 0.9 is the first uv that installs a released Python 3.14. An older one settles for
# 3.14.0rc2, where pydantic fails on import and takes every API test with it.
required-version = ">=0.9"

[tool.hatch.build.targets.wheel]
# Every file in the package ships, not only Python: the fonts we draw with
# (`squidpdf/fonts/`), their licences and README go in the wheel as they are.
packages = ["src/squidpdf"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
# BLE: a broad except says why. D1: docstrings everywhere. RUF100: no stale noqa.
# TID: only core/pdf/lowlevel.py talks to MuPDF's low-level API.
# RUF001-3: no invisible or look-alike characters in strings, docstrings or comments.
# PLR0917: past three parameters, the rest are keyword-only, so every call names them.
# S101: no bare assert; a failure says what it expected (tests/helpers.py). RET505/506: no
# else after a return or raise. PLR2004: a number in a comparison is a named constant.
# ASYNC: nothing blocking on the event loop.
select = [
    "E", "F", "I", "UP", "B", "BLE", "D1", "RUF001", "RUF002", "RUF003", "RUF100", "TID",
    "PLR0917", "S101", "RET505", "RET506", "PLR2004", "ASYNC",
]
# ASYNC109: a timeout parameter on an async function. Ours go to the pool, which kills a
# worker at its deadline (pebble); asyncio's own timeout can't stop a process.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Test names are sentences already; a docstring there is welcome, not required.
# A test's parameters are fixtures, which pytest passes by name anyway.
# A test's numbers are the case it sets up, said once. A test may poll until something
# happens: it has nothing to await.
"tests/**" = ["D1", "PLR0917", "PLR2004", "ASYNC110"]
# The one place a bare assert belongs: the helpers every other check goes through.
"tests/helpers.py" = ["S101"]
"src/squidpdf/core/pdf/lowlevel.py" = ["TID251"]

[tool.ruff.lint.pylint]
max-positional-args = 3

[tool.ruff.lint.flake8-tidy-imports]
# Absolute only, so the layer rules in tests/test_layers.py read every import by its full name.
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pymupdf.mupdf".msg = "MuPDF's low-level API lives in core/pdf/lowlevel.py; add a PdfFile method there."

[tool.pytest.ini_options]
testpaths = ["tests"]
# A new warning fails the suite. These two are our dependencies' own, not ours to fix.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "scripts"]
warn_unused_ignores = true
warn_redundant_casts = true
# Test functions are unannotated; without this mypy skips their bodies entirely.
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pymupdf.*", "fontTools.*"]
ignore_missing_imports = true

# Only the shipped package is required to be fully annotated; tests are not.
[[tool.mypy.overrides]]
module = "squidpdf.*"
disallow_untyped_defs = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "scripts"]
