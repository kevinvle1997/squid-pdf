[project]
name = "squidpdf"
version = "0.1.0"
description = "Correct text already in a PDF, and know beforehand whether it will look identical."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.24",
    "fonttools>=4.53",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "orjson>=3.10",
    "xxhash>=3.5",
    "pebble>=5.2",
]

[project.scripts]
squidpdf = "squidpdf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    # Pre-1.0: its checks change between releases, so move this pin on purpose.
    "ty==0.0.84",
    "httpx>=0.28",
    # The API's tests need it, and the CLI must still run without it.
    "squidpdf[api]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Every file in the package ships, not only Python: the fonts we draw with
# (`squidpdf/fonts/`), their licences and README go in the wheel as they are.
packages = ["src/squidpdf"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
# BLE: a broad except says why. D1: docstrings everywhere. RUF100: no stale noqa.
# TID: only core/pdf.py talks to MuPDF's low-level API.
# RUF001-3: no invisible or look-alike characters in strings, docstrings or comments.
select = ["E", "F", "I", "UP", "B", "BLE", "D1", "RUF001", "RUF002", "RUF003", "RUF100", "TID"]

[tool.ruff.lint.per-file-ignores]
# Test names are sentences already; a docstring there is welcome, not required.
"tests/**" = ["D1"]
"src/squidpdf/core/pdf.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pymupdf.mupdf".msg = "MuPDF's low-level API lives in core/pdf.py; add a PdfFile method there."

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
# Test functions are unannotated; without this mypy skips their bodies entirely.
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pymupdf.*", "fontTools.*"]
ignore_missing_imports = true

# Only the shipped package is required to be fully annotated; tests are not.
[[tool.mypy.overrides]]
module = "squidpdf.*"
disallow_untyped_defs = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]
